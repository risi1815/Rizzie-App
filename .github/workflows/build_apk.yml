name: Flutter Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java 17 (Required for modern Android Gradle builds)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up the Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Install packages from pubspec.yaml
      - name: Install Dependencies
        run: flutter pub get

        # This generates the missing 'android' folder on the fly
      - name: Create Platform Files
        run: flutter create .

      # 5. Build the production-ready APK
      - name: Build APK
        run: flutter build apk --release

      # 6. Upload the built APK as a downloadable artifact (Updated to v4)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rizzie-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
